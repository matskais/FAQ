<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>FAQ管理画面</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: auto; padding: 20px; }
    textarea { width: 100%; height: 300px; }
    button { margin-top: 10px; padding: 10px; background: #2196F3; color: white; border: none; }
  </style>
</head>
<body>
  <h1>FAQ管理画面</h1>
  <p>以下にFAQデータ（JSON形式）を入力・編集して保存してください。</p>
  <textarea id="jsonArea"></textarea><br>
  <button onclick="saveData()">保存</button>
  <button onclick="loadData()">読込</button>

  <script>
    function saveData() {
      try {
        const json = JSON.parse(document.getElementById("jsonArea").value);
        localStorage.setItem("faqBotData", JSON.stringify(json));
        alert("保存しました！");
      } catch (e) {
        alert("JSONが正しくありません！");
      }
    }

    function loadData() {
      const stored = localStorage.getItem("faqBotData");
      if (stored) {
        document.getElementById("jsonArea").value = stored;
      } else {
        alert("保存データがありません");
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
